[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-usb-test-lab"
version = "0.1.0"
description = "Privacy-conscious Linux USB inventory and regression checks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ashut90" }]

[project.scripts]
usb-lab = "usb_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
